<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HRMS Lite</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EH%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f7fa; --surface:#ffffff; --border:#e5e9f2; --text:#1e293b; --muted:#64748b; --faint:#94a3b8;
  --primary:#0f766e; --primary-hover:#115e59; --primary-soft:#f0fdfa;
  --success:#15803d; --success-soft:#dcfce7; --warn:#b45309; --warn-soft:#fef3c7;
  --danger:#b91c1c; --danger-soft:#fee2e2; --side:#0f172a; --side-hover:#1e293b;
  --grad-a:#14b8a6; --accent-light:#5eead4; --th-bg:#f8fafc; --input-bg:#fff; --input-border:#d6dce8;
  --radius:12px; --shadow:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);
     display:flex;min-height:100vh;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* ---------- sidebar ---------- */
nav{width:248px;background:var(--side);color:#cbd5e1;padding:22px 16px;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:4px 10px 22px}
.brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--grad-a),var(--primary));
            color:#fff;font-weight:800;display:grid;place-items:center;font-size:16px}
.brand-name{color:#fff;font-weight:700;font-size:16px;line-height:1.2}
.brand-sub{color:#64748b;font-size:12px}
.nav-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#64748b;padding:14px 12px 6px}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:#cbd5e1;
           padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;margin-bottom:2px;position:relative}
nav button:hover{background:var(--side-hover);color:#fff}
nav button.active{background:rgba(99,102,241,.18);color:#fff}
nav button.active::before{content:"";position:absolute;left:-16px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent-light)}
nav .dot{width:8px;height:8px;border-radius:50%;background:#475569;flex-shrink:0}
nav button.active .dot{background:var(--accent-light)}
nav button.reset{margin-top:auto;font-size:13px;color:#fca5a5;justify-content:center;border:1px solid #334155}
nav button.reset:hover{background:#7f1d1d;color:#fff}

/* ---------- main area ---------- */
.shell{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 32px;background:var(--surface);
        border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.topbar h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
.topbar p{color:var(--muted);font-size:13px;margin-top:2px}
.user{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:700;font-size:13px}
main{flex:1;padding:28px 32px 48px;max-width:1280px;width:100%}

/* ---------- cards & panels ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--primary)}
.card.green::before{background:var(--success)} .card.amber::before{background:var(--warn)} .card.blue::before{background:#1d4ed8}
.card .label{color:var(--muted);font-size:13px;font-weight:500}
.card .num{font-size:28px;font-weight:700;margin-top:6px;letter-spacing:-.02em}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow);margin-bottom:20px;overflow-x:auto}
.panel h3{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h2{font-size:15px;font-weight:600;margin:0 0 14px;color:var(--text)}
h2 .muted{font-weight:400}

/* ---------- tables ---------- */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
th{text-align:left;padding:10px 12px;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;background:var(--th-bg);border-bottom:1px solid var(--border);white-space:nowrap}
th:first-child{border-radius:8px 0 0 0} th:last-child{border-radius:0 8px 0 0}
td{text-align:left;padding:12px;border-bottom:1px solid #eef1f6;white-space:nowrap}
tr:hover td{background:#fafbff}
tr:last-child td{border-bottom:none}

/* ---------- forms & buttons ---------- */
form.inline{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
input,select{padding:9px 12px;border:1px solid var(--input-border);border-radius:8px;font-size:13.5px;background:var(--input-bg);color:var(--text);outline:none;font-family:inherit}
input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
input.search{width:300px;margin-bottom:14px}
button{font-family:inherit}
button.btn{background:var(--primary);color:#fff;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;margin-right:4px;transition:background .15s}
button.btn:hover{background:var(--primary-hover)}
button.btn:disabled{opacity:.4;cursor:not-allowed}
button.btn.danger{background:#fff;color:var(--danger);border:1px solid #fecaca}
button.btn.danger:hover{background:var(--danger-soft)}
button.btn.ok{background:var(--success)} button.btn.ok:hover{background:#15803d}
button.btn.light{background:#fff;color:var(--text);border:1px solid #d6dce8}
button.btn.light:hover{background:#f8fafc}

/* ---------- badges ---------- */
.badge{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;display:inline-block}
.Pending{background:var(--warn-soft);color:#92400e}
.Approved,.Present,.Active{background:var(--success-soft);color:#166534}
.Rejected,.Absent,.Inactive{background:var(--danger-soft);color:#991b1b}
.muted{color:var(--faint)}
.Scheduled{background:#ccfbf1;color:#115e59}
.Completed{background:var(--success-soft);color:#166534}
.Cancelled{background:#f1f5f9;color:#475569}

/* ---------- performance analysis: pie charts and explanations ---------- */
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.pie{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.pie svg{flex-shrink:0}
.legend{list-style:none;font-size:13px;line-height:1.9}
.legend li{display:flex;align-items:center;gap:8px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;flex-shrink:0}


/* ---------- assistant ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 16px}
.chips button{background:var(--primary-soft);color:var(--primary);border:1px solid #ccfbf1;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:500;cursor:pointer}
.chips button:hover{background:#ccfbf1}
.answer{background:#f8fafc;border:1px solid var(--border);border-left:4px solid var(--primary);padding:16px 18px;border-radius:8px;font-size:14.5px;line-height:1.6;margin-top:16px}
.answer ul{margin:8px 0 0 20px}
.hint{color:var(--muted);font-size:13px;margin-bottom:14px}

/* ---------- floating chat widget ---------- */
#bot-fab{display:grid;place-items:center;position:fixed;right:24px;bottom:24px;width:60px;height:60px;border-radius:50%;border:none;cursor:pointer;
         background:linear-gradient(135deg,var(--grad-a),var(--primary));color:#fff;font-size:26px;box-shadow:0 10px 25px rgba(79,70,229,.4);z-index:50}
#bot-fab:hover{transform:scale(1.05)}
#bot-panel{position:fixed;right:24px;bottom:96px;width:380px;max-width:calc(100vw - 32px);height:560px;max-height:calc(100vh - 130px);
           background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 20px 50px rgba(15,23,42,.25);
           display:none;flex-direction:column;overflow:hidden;z-index:50}
#bot-panel.open{display:flex}
.bot-head{background:var(--side);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.bot-head b{font-size:15px}
.bot-sub{font-size:12px;color:#94a3b8}
.bot-head button{background:none;border:none;color:#cbd5e1;font-size:24px;cursor:pointer;line-height:1}
.bot-who{padding:10px 14px;border-bottom:1px solid var(--border);font-size:12.5px;color:var(--muted)}
.bot-who select{width:100%;margin-top:4px}
#bot-log{flex:1;overflow-y:auto;padding:14px;background:#f8fafc;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:12px;font-size:13.5px;line-height:1.5}
.msg p{margin:0}
.msg ul{margin:6px 0 0 18px}
.msg.bot{background:#fff;border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--primary);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.bot-form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border)}
.bot-form input{flex:1;min-width:0}

/* ---------- toasts, pager, panel headers ---------- */
#toast-wrap{position:fixed;top:20px;right:20px;z-index:100;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#0f172a;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 10px 25px rgba(15,23,42,.25);
       font-size:13.5px;min-width:260px;max-width:380px;transition:opacity .4s,transform .4s}
.toast.error{background:#b91c1c}
.toast.hide{opacity:0;transform:translateX(12px)}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:13px;color:var(--muted)}
.pager button{margin-left:6px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.panel-head h3{margin:0}

/* ---------- progress bar (performance) ---------- */
.bar{display:inline-block;width:120px;height:8px;background:#e5e9f2;border-radius:99px;vertical-align:middle;overflow:hidden}
.bar span{display:block;height:100%;background:var(--primary)}

/* ---------- hide / show sidebar (three-line button) ---------- */
.menu-toggle{width:40px;height:40px;border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;
             display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;margin-right:14px;flex-shrink:0}
.menu-toggle:hover{background:#f8fafc}
.menu-toggle span{display:block;width:18px;height:2px;border-radius:2px;background:var(--text)}
body.nav-collapsed nav{display:none}
.topbar-left{display:flex;align-items:center}


/* ---------- professional touches ---------- */
.greet{text-align:right;line-height:1.3}
.greet #greeting{font-weight:600;color:var(--text);font-size:13px}
.greet #today-date{font-size:12px;color:var(--muted)}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:16px 32px;border-top:1px solid var(--border);color:var(--faint);font-size:12px;background:var(--surface)}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.overlay.open{display:flex}
.dialog{background:#fff;border-radius:14px;padding:24px;width:100%;max-width:420px;box-shadow:0 25px 60px rgba(15,23,42,.35)}
.dialog h3{font-size:17px;margin-bottom:8px}
.dialog p{color:var(--muted);line-height:1.5}
.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
button.danger-solid{background:var(--danger);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer}
button.danger-solid:hover{background:#b91c1c}
.call-btn{display:inline-block;text-decoration:none;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
.call-btn:hover{background:#d1fae5}
@media print{
  nav,.topbar button,.menu-toggle,#bot-fab,#bot-panel,.overlay,#toast-wrap,.foot,.btn,form,.chips,input.search,.hint{display:none !important}
  body{display:block;background:#fff}
  main{padding:0}
  .topbar{position:static;box-shadow:none}
  .panel,.card{box-shadow:none;break-inside:avoid;border-color:#cbd5e1}
  th{background:#f1f5f9}
}

@media(max-width:900px){
  body{flex-direction:column}
  nav{width:100%;height:auto;position:static}
  .topbar{padding:16px 20px}
  main{padding:20px}
}

/* ---------- login ---------- */
#login{position:fixed;inset:0;z-index:1000;background:linear-gradient(135deg,#0f172a,var(--primary-hover));display:none;align-items:center;justify-content:center;padding:20px}
body.logged-out #login{display:flex}
body.logged-out nav,body.logged-out .shell,body.logged-out #bot-fab,body.logged-out #bot-panel{display:none!important}
.login-card{background:#fff;border-radius:16px;padding:32px 30px;width:100%;max-width:400px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.login-card h2{font-size:22px;margin:14px 0 4px}
.login-card .sub{color:var(--muted);margin-bottom:20px}
.login-card label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.login-card select,.login-card input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font:inherit;background:#fff}
.login-card select:focus,.login-card input:focus{outline:2px solid var(--primary);border-color:var(--primary)}
.login-card .btn{width:100%;margin-top:20px;padding:11px;justify-content:center}
.login-err{color:var(--danger);font-size:13px;min-height:18px;margin-top:10px}
.login-card .brand-mark{width:44px;height:44px}
nav button.logout{font-size:13px;justify-content:center;border:1px solid #334155;margin-top:auto}
nav button.logout+button.reset{margin-top:8px}
body.role-employee [data-hr],body.role-employee .bot-who{display:none!important}
.user .who-role{font-size:11px;color:var(--muted)}
.logout-top{margin-left:12px}

/* ---------- design assistant ---------- */
#design-fab{position:fixed;right:32px;bottom:96px;width:46px;height:46px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--primary);cursor:pointer;display:grid;place-items:center;box-shadow:0 6px 18px rgba(15,23,42,.18);z-index:50}
#design-fab:hover{transform:scale(1.06)}
#design-panel{position:fixed;right:24px;bottom:152px;width:340px;max-width:calc(100vw - 32px);height:440px;max-height:calc(100vh - 180px);background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 18px 50px rgba(15,23,42,.25);display:none;flex-direction:column;overflow:hidden;z-index:60}
#design-panel.open{display:flex}
#design-log{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
#design-log .msg{padding:8px 11px;border-radius:10px;max-width:88%;font-size:13px}
#design-log .msg.bot{background:var(--primary-soft);color:var(--text);align-self:flex-start}
#design-log .msg.me{background:var(--primary);color:#fff;align-self:flex-end}
.design-chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-top:1px solid var(--border)}
.design-chips button{background:var(--primary-soft);color:var(--primary);border:1px solid var(--border);padding:4px 10px;border-radius:999px;font-size:12px;cursor:pointer}
body.logged-out #design-fab,body.logged-out #design-panel{display:none!important}
/* attendance calendar */
.cal-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cal-head h3{margin:0 8px 0 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-dow{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;text-align:center;padding:4px 0}
.cal-cell{min-height:68px;border:1px solid var(--border);border-radius:8px;padding:6px 7px;font-size:12px;background:var(--surface);cursor:pointer;text-align:left;font-family:inherit;color:var(--text);display:flex;flex-direction:column;gap:2px}
.cal-cell .d{font-weight:600;font-size:13px}
.cal-cell .t{font-size:11px;color:var(--muted);line-height:1.3}
.cal-empty{border:none;background:none;cursor:default}
.cal-off{background:var(--th-bg);color:var(--faint)}
.cal-p{background:var(--success-soft);border-color:transparent}
.cal-l{background:var(--primary-soft);border-color:transparent}
.cal-w{background:var(--warn-soft);border-color:transparent}
.cal-today .d{color:var(--primary)}
.cal-today{box-shadow:inset 0 0 0 2px var(--primary)}
.cal-sel{outline:2px solid var(--text);outline-offset:1px}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.cal-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--border)}
@media(max-width:700px){.cal-cell{min-height:52px;padding:4px}.cal-cell .t{display:none}}
/* dark mode */
body.dark{color-scheme:dark}
body.dark .login-card,body.dark #bot-panel,body.dark .dialog{background:var(--surface);color:var(--text)}
body.dark .login-card select,body.dark .login-card input{background:var(--input-bg);color:var(--text)}
body.dark .btn.light,body.dark button.btn.light{background:var(--border);color:var(--text)}
body.dark tr:hover td{background:rgba(148,163,184,.08)}
body.dark td{border-bottom-color:var(--border)}
body.dark button.btn:not(.ok):not(.danger):not(.light):not(.danger-solid){color:#08111f}
body.dark .menu-toggle{background:var(--surface);color:var(--text)}
body.dark .menu-toggle span{background:var(--text)}
body.dark button.btn.danger{background:transparent;color:#fca5a5;border-color:#7f1d1d}
body.dark .msg.bot{background:var(--th-bg);color:var(--text)}
body.dark .Approved,body.dark .Present,body.dark .Active{color:#86efac}
body.dark .Pending{color:#fcd34d}
body.dark .Rejected,body.dark .Absent,body.dark .Inactive{color:#fca5a5}
body.dark .Scheduled{background:#0f2f2c;color:#5eead4}
body.dark .chips button{border-color:var(--border)}
body.dark .bot-form,body.dark .bot-who{background:var(--surface)}
body.compact .panel{padding:12px 14px;margin-bottom:12px}
body.compact td,body.compact th{padding-top:5px;padding-bottom:5px}
body.compact main{padding:14px}
</style>
</head>
<body class="logged-out">
<div id="login">
  <form class="login-card" onsubmit="return doLogin(event)">
    <div class="brand-mark">H</div>
    <h2>HRMS Lite</h2>
    <p class="sub">Sign in to continue</p>
    <label for="login-role">Login as</label>
    <select id="login-role" onchange="loginRoleChanged()">
      <option value="hr">HR Admin</option>
      <option value="manager">Manager</option>
      <option value="employee">Employee</option>
    </select>
    <div id="login-emp-wrap" style="display:none">
      <label for="login-emp">Employee</label>
      <select id="login-emp"></select>
    </div>
    <label for="login-pass">Password</label>
    <input id="login-pass" type="password" autocomplete="current-password" required>
    <div class="login-err" id="login-err"></div>
    <button class="btn" type="submit">Sign in</button>
  </form>
</div>
<nav>
  <div class="brand">
    <div class="brand-mark">H</div>
    <div><div class="brand-name">HRMS Lite</div><div class="brand-sub">People management</div></div>
  </div>
  <div class="nav-label">Workspace</div>
  <button data-view="dashboard" onclick="setView('dashboard')"><span class="dot"></span>Dashboard</button>
  <button data-hr data-view="employees" onclick="setView('employees')"><span class="dot"></span>Employees</button>
  <button data-view="attendance" onclick="setView('attendance')"><span class="dot"></span>Attendance</button>
  <button data-view="leave" onclick="setView('leave')"><span class="dot"></span>Leave</button>
  <button data-hr data-view="payroll" onclick="setView('payroll')"><span class="dot"></span>Payroll</button>
  <div class="nav-label" data-hr>Talent</div>
  <button data-hr data-view="recruitment" onclick="setView('recruitment')"><span class="dot"></span>Recruitment (ATS)</button>
  <button data-hr data-view="performance" onclick="setView('performance')"><span class="dot"></span>Performance (PMS)</button>
  <button data-hr data-view="radar" onclick="setView('radar')"><span class="dot"></span>Retention Radar</button>
  <div class="nav-label" data-hr>Tools</div>
  <button data-hr data-view="assistant" onclick="setView('assistant')"><span class="dot"></span>HR Assistant</button>
  <button class="logout" onclick="logout()">Log out</button>
  <button class="reset" data-hr onclick="resetDemo()">Reset demo data</button>
</nav>
<div class="shell">
  <header class="topbar">
    <div class="topbar-left">
      <button class="menu-toggle" onclick="toggleNav()" title="Show or hide sidebar" aria-label="Show or hide sidebar">
        <span></span><span></span><span></span>
      </button>

<script>
const KEY = 'hrms-lite-v4';
const STAGE_ORDER = ['Applied', 'Screening', 'Interview', 'Offer', 'Hired'];
const SOURCES = ['LinkedIn', 'Referral', 'Job board', 'Walk-in', 'Campus', 'Other'];
const CALL_OUTCOMES = ['Reached: interested', 'Reached: call back later', 'Reached: not interested', 'No answer', 'Voicemail left'];
const JOB_SKILLS = {
  j1: ['JavaScript', 'SQL', 'Team leadership'], j2: ['Recruitment', 'Communication', 'Excel'],
  j3: ['Negotiation', 'Communication', 'Team leadership'], j4: ['Excel', 'Accounting', 'SQL'],
  j5: ['Marketing', 'Communication', 'Excel']
};
const SKILL_POOL = ['JavaScript', 'Python', 'SQL', 'Communication', 'Negotiation', 'Excel', 'Recruitment', 'Accounting', 'Marketing', 'Team leadership'];
const DEPTS = ['Engineering', 'HR', 'Sales', 'Finance', 'Marketing'];
const TITLES = {
  dashboard: ['Dashboard', 'Overview of people, attendance and leave'],
  employees: ['Employees', 'Manage your team members'],
  attendance: ['Attendance', 'Check in and out and review today\'s records'],
  leave: ['Leave management', 'Apply for leave and review requests'],
  payroll: ['Payroll', 'Monthly salary estimates for active employees'],
  recruitment: ['Recruitment (ATS)', 'Manage job openings and the candidate pipeline'],
  performance: ['Performance (PMS)', 'Goals, review ratings and progress'],
  radar: ['Retention Radar', 'Explainable attrition risk and raise simulator'],
  assistant: ['HR Assistant', 'Ask questions about your people data']
};
let view = 'dashboard';
let search = '';
let lastEmpId = null;          // remembers the employee last discussed, for follow-up questions
let assistantAnswer = '';
let state = load();

/* ---------- demo data: 100 employees ---------- */
function makeEmployees(n) {
  const first = ['Aarav','Diya','Vihaan','Ananya','Kabir','Meera','Arjun','Sneha','Rohit','Kavya',
                 'Ishaan','Pooja','Aditya','Neha','Karan','Riya','Siddharth','Tanvi','Varun','Isha'];
  const last = ['Mehta','Chopra','Bhatt','Srinivasan','Kaur','Thakur','Verma','Agarwal',
                'Pandey','Chatterjee','Sawant','Pawar','Bansal','Dutta','Khanna','Wadhwa'];
  const roles = {
    Engineering: [['Software Engineer', 80000], ['Senior Engineer', 120000], ['QA Analyst', 60000], ['DevOps Engineer', 95000]],
    HR:          [['HR Executive', 55000], ['Recruiter', 50000], ['HR Manager', 85000]],
    Sales:       [['Sales Executive', 50000], ['Sales Manager', 105000]],
    Finance:     [['Accountant', 60000], ['Finance Manager', 100000]],
    Marketing:   [['Marketing Executive', 55000], ['Marketing Lead', 95000]]
  };
  const list = [];
  for (let i = 0; i < n; i++) {
    const f = first[i % first.length];
    const l = last[(i + Math.floor(i / first.length)) % last.length];   // spreads surnames across the list
    const dept = DEPTS[i % DEPTS.length];
    const [role, base] = roles[dept][i % roles[dept].length];
    list.push({
      id: 'e' + (i + 1),
      name: f + ' ' + l,
      email: (f + '.' + l + (i + 1)).toLowerCase() + '@company.com',
      dept, role,
      salary: base + ((i * 1371) % 15) * 1000,
      status: i % 17 === 0 ? 'Inactive' : 'Active'
    });
  }
  return list;
}
function seed() {
  const employees = makeEmployees(100);
  const t = today();
  // Attendance starts empty: people check in and out manually (HR can also add or correct records).
  const attendance = [];
  const types = ['Casual', 'Sick', 'Earned', 'Unpaid'];
  const statuses = ['Pending', 'Approved', 'Rejected'];
  const reasons = ['Personal work', 'Family function', 'Medical', 'Travel', 'Festival'];
  const leaves = Array.from({ length: 18 }, (_, i) => {
    const start = new Date();
    start.setDate(start.getDate() + (i % 9) - 2);
    const end = new Date(start);
    end.setDate(end.getDate() + (i % 3));
    return {
      id: 'l' + i, empId: employees[(i * 7) % 60].id, type: types[i % 4],
      from: ymd(start), to: ymd(end),
      reason: reasons[i % 5], status: statuses[i % 3]
    };
  });
  // deliberate overlap so the assistant has something to find
  leaves.push({ ...leaves[0], id: 'l99', type: 'Sick', status: 'Approved', reason: 'Doctor visit' });
  // recruitment (ATS) demo data
  const jobs = [
    { id: 'j1', title: 'Senior Software Engineer', dept: 'Engineering', location: 'Panjim, Goa', openings: 2, status: 'Open', posted: daysAgo(12) },
    { id: 'j2', title: 'HR Executive', dept: 'HR', location: 'Mumbai', openings: 1, status: 'Open', posted: daysAgo(7) },
    { id: 'j3', title: 'Sales Manager', dept: 'Sales', location: 'Bengaluru', openings: 1, status: 'Open', posted: daysAgo(20) },
    { id: 'j4', title: 'Financial Analyst', dept: 'Finance', location: 'Pune', openings: 1, status: 'Closed', posted: daysAgo(45) },
    { id: 'j5', title: 'Digital Marketing Lead', dept: 'Marketing', location: 'Remote', openings: 1, status: 'Open', posted: daysAgo(3) }
  ];
  const stageList = ['Applied', 'Screening', 'Interview', 'Offer', 'Hired', 'Rejected'];
  const candNames = ['Ravi Kumar', 'Sana Khan', 'Tejas Shah', 'Nisha Rao', 'Yash Gupta', 'Farah Ali',
                     'Dev Malhotra', 'Ira Bose', 'Manav Jain', 'Lakshmi Iyer', 'Omkar Patil', 'Zara Fernandes',
                     'Harsh Vyas', 'Meghna Das', 'Kunal Mehra', 'Aditi Joshi', 'Rahul Nair', 'Sofia Dsouza',
                     'Pranav Hegde', 'Tara Menon', 'Abhay Singh', 'Kiara Pinto', 'Nikhil Kapoor', 'Divya Rao'];
  const candidates = candNames.map((name, i) => {
    const stage = stageList[i % stageList.length];
    return {
      id: 'c' + (i + 1), name,
      email: name.toLowerCase().replace(/[^a-z]/g, '') + '@mail.com',
      jobId: jobs[i % jobs.length].id,
      stage,
      rating: (i % 5) + 1,
      offer: (stage === 'Offer' || stage === 'Hired') ? 60000 + i * 1500 : 0,
      applied: daysAgo(i % 25),
      converted: false
    };
  });

  // performance (PMS) demo data
  const goalTitles = ['Deliver quarterly roadmap', 'Improve team process', 'Complete certification', 'Reduce ticket backlog', 'Grow key accounts'];
  const goals = [];
  employees.forEach((e, i) => {
    goals.push({ id: 'g' + i, empId: e.id, title: goalTitles[i % 5], cycle: 'Q4 2026', progress: (i * 37) % 101 });
    if (i % 2 === 0) goals.push({ id: 'gb' + i, empId: e.id, title: goalTitles[(i + 2) % 5], cycle: 'Q4 2026', progress: (i * 53) % 101 });
  });
  const reviews = employees.map((e, i) => ({
    id: 'r' + i, empId: e.id, cycle: 'Q4 2026',
    rating: i % 4 === 0 ? 0 : ((i * 3) % 5) + 1,
    status: i % 4 === 0 ? 'Pending' : 'Completed'
  }));

  // ATS demo enrichment: skills, source of hire and hire dates
  jobs.forEach(j => { j.skills = JOB_SKILLS[j.id] || []; });
  candidates.forEach(c => {
    const n = Number(c.id.slice(1)) - 1;
    c.skills = [...new Set([SKILL_POOL[n % 10], SKILL_POOL[(n * 3) % 10], SKILL_POOL[(n * 7) % 10]])];
    c.source = SOURCES[n % 5];
    c.phone = '+91 9' + String(800000000 + n * 7919).slice(0, 9);
    c.calls = n % 4 === 0 ? [{ id: 'k' + n, date: daysAgo(n % 5), outcome: CALL_OUTCOMES[n % 5], notes: 'Initial screening call' }] : [];
    if (c.stage === 'Hired') c.hiredOn = daysAgo(Math.max(0, n % 25 - 3));
  });
  // interview schedule demo data: one interview for each candidate in the Interview stage
  const slots = ['10:00', '11:30', '14:00', '15:30', '12:00', '16:00'];
  const modes = ['Video call', 'In person', 'Phone'];
  const activeEmps = employees.filter(e => e.status === 'Active');
  const interviews = candidates.filter(c => c.stage === 'Interview').slice(0, 6).map((c, i) => ({
    id: 'i' + i, candId: c.id, interviewer: activeEmps[i * 5].id,
    date: daysAhead(i % 3 + 1), time: slots[i], mode: modes[i % 3], link: '',
    status: 'Scheduled', feedback: ''
  }));
  return { employees, attendance, leaves, jobs, candidates, goals, reviews, interviews };
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.employees) {
      s.attendance = (s.attendance || []).filter(a => !/^a\d{1,3}$/.test(a.id));   // drop the old auto-generated demo check-ins
      s.interviews = s.interviews || [];   // saved data from earlier versions has no interviews yet
      (s.jobs || []).forEach(j => { j.skills = j.skills || []; });
      (s.candidates || []).forEach(c => { c.skills = c.skills || []; c.source = c.source || 'Other'; c.phone = c.phone || ''; c.calls = c.calls || []; });
      return s;
    }
  } catch (e) {}
  return seed();
}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
function resetDemo() {
  askConfirm({ title: 'Reset demo data', message: 'Reset all data to the 100-employee demo set? Your changes will be lost.', action: 'Reset' }, do_resetDemo);
}
function do_resetDemo() {
  state = seed();
  lastEmpId = null;
  assistantAnswer = '';
  save(); render();
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
// Local calendar date (YYYY-MM-DD). The UTC ISO date is the previous day before 5:30 AM IST.
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function today() { return ymd(new Date()); }
function nowTime() { return new Date().toTimeString().slice(0, 5); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function emp(id) { return state.employees.find(e => e.id === id); }
function empName(id) { return emp(id) ? emp(id).name : 'Unknown'; }
function money(n) { return '₹' + Math.round(n).toLocaleString('en-IN'); }
function payOf(s) {
  const basic = s * 0.5, hra = s * 0.2, allow = s * 0.3, pf = basic * 0.12;
  return { gross: s, basic, hra, allow, pf, net: s - pf };
}

/* ---------- feedback, paging and export ---------- */
let empPage = 1;
const PAGE = 20;
function goPage(p) { empPage = p; render(); }
function toast(msg, type = 'success') {
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => el.classList.add('hide'), 2800);
  setTimeout(() => el.remove(), 3300);
}
function exportCSV(filename, headers, rows) {
  const cell = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const csv = [headers, ...rows].map(r => r.map(cell).join(',')).join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}
function exportEmployees() {
  exportCSV('employees.csv', ['Name', 'Email', 'Department', 'Role', 'Monthly salary', 'Status'],
    state.employees.map(e => [e.name, e.email, e.dept, e.role, e.salary, e.status]));
  toast('Employee list exported.');
}
function exportPayroll() {
  exportCSV('payroll.csv', ['Name', 'Department', 'Basic', 'HRA', 'Allowances', 'Gross', 'PF', 'Net'],
    state.employees.filter(e => e.status === 'Active').map(e => {
      const p = payOf(e.salary);
      return [e.name, e.dept, Math.round(p.basic), Math.round(p.hra), Math.round(p.allow),
              Math.round(p.gross), Math.round(p.pf), Math.round(p.net)];
    }));
  toast('Payroll exported.');
}

/* ---------- styled confirmation dialog, replaces the browser pop-up ---------- */
let pendingAction = null;
function askConfirm(opts, action) {
  pendingAction = action;
  document.getElementById('confirm-title').textContent = opts.title;
  document.getElementById('confirm-msg').textContent = opts.message;
  const ok = document.getElementById('confirm-ok');
  ok.textContent = opts.action || 'Confirm';
  document.getElementById('confirm-overlay').classList.add('open');
  ok.focus();
}
function closeConfirm(accept) {
  document.getElementById('confirm-overlay').classList.remove('open');
  const action = pendingAction;
  pendingAction = null;
  if (accept && action) action();
}
function greeting() {
  const h = new Date().getHours();
  return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
}

/* ---------- navigation ---------- */
function toggleNav() {
  document.body.classList.toggle('nav-collapsed');
  localStorage.setItem('hrms-nav-collapsed', document.body.classList.contains('nav-collapsed') ? '1' : '0');
}
function restoreNav() {
  if (localStorage.getItem('hrms-nav-collapsed') === '1') document.body.classList.add('nav-collapsed');
}
function setView(v) {
  view = v;
  search = '';
  render();
}
function render() {
  document.querySelectorAll('nav button[data-view]').forEach(b =>
    b.classList.toggle('active', b.dataset.view === view));
  document.getElementById('page-title').textContent = TITLES[view][0];
  document.getElementById('page-sub').textContent = TITLES[view][1];
  document.getElementById('greeting').textContent = greeting() + ', ' + (isHR() ? 'HR Admin' : (emp(session.empId) || {name: 'there'}).name + (isManager() ? ' (Manager)' : ''));
  document.getElementById('today-date').textContent =
    new Date().toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  if (!isHR() && !EMP_VIEWS.includes(view)) { view = 'dashboard'; document.getElementById('page-title').textContent = TITLES.dashboard[0]; }
  const views = { dashboard: isHR() ? dashboard : myDashboard, employees, attendance, leave, payroll, recruitment, performance, radar: retentionView, assistant };
  document.getElementById('app').innerHTML = views[view]();
}

/* ---------- Dashboard ---------- */
function dashboard() {
  const presentToday = checkedInIds().size;
  const pending = state.leaves.filter(l => l.status === 'Pending').length;
  const depts = new Set(state.employees.map(e => e.dept)).size;
  const active = state.employees.filter(e => e.status === 'Active').length;
  const recent = [...state.leaves].reverse().slice(0, 6);
  return `
  <div class="cards">
    <div class="card"><div class="label">Total employees</div><div class="num">${state.employees.length}</div></div>
    <div class="card green"><div class="label">Active employees</div><div class="num">${active}</div></div>
    <div class="card blue"><div class="label">Checked in today</div><div class="num">${presentToday}</div></div>
    <div class="card amber"><div class="label">Pending leave requests</div><div class="num">${pending}</div></div>
    <div class="card"><div class="label">Departments</div><div class="num">${depts}</div></div>
    <div class="card amber"><div class="label">High retention risk</div><div class="num">${radarActive().filter(x => x.r.level === 'High').length}</div></div>
    <div class="card blue"><div class="label">Open job positions</div><div class="num">${state.jobs.filter(j => j.status === 'Open').length}</div></div>
    <div class="card"><div class="label">Average review rating</div><div class="num">${avgRating() ? avgRating().toFixed(1) + ' / 5' : '-'}</div></div>
  </div>
  <div class="panel">
    <h3>Recent leave requests</h3>
    ${recent.length ? `<table>
      <tr><th>Employee</th><th>Type</th><th>From</th><th>To</th><th>Status</th></tr>
      ${recent.map(l => `<tr><td>${esc(empName(l.empId))}</td><td>${esc(l.type)}</td><td>${l.from}</td><td>${l.to}</td><td><span class="badge ${l.status}">${l.status}</span></td></tr>`).join('')}
    </table>` : '<p class="muted">No leave requests yet.</p>'}
  </div>`;
}

/* ---------- Employees ---------- */
function employees() {
  const q = search.toLowerCase();
  const filtered = state.employees.filter(e =>
    (e.name + e.dept + e.role + e.email).toLowerCase().includes(q));
  const pages = Math.max(1, Math.ceil(filtered.length / PAGE));
  if (empPage > pages) empPage = pages;
  const list = filtered.slice((empPage - 1) * PAGE, empPage * PAGE);
  return `
  <div class="panel">
    <h3>Add employee</h3>
    <form class="inline" onsubmit="return addEmp(event)">
      <input name="name" placeholder="Full name" required>
      <input name="email" type="email" placeholder="Email" required>
      <input name="dept" placeholder="Department" required>
      <input name="role" placeholder="Job title" required>
      <input name="salary" type="number" min="0" placeholder="Monthly salary" required>
      <button class="btn" type="submit">Add employee</button>
    </form>
  </div>
  <div class="panel">
    <div class="panel-head"><h3>All employees <span class="muted" style="font-weight:400">${filtered.length} of ${state.employees.length}</span></h3>
      <button class="btn light" onclick="exportEmployees()">Export CSV</button></div>
    <input class="search" placeholder="Search by name, email, department or role" value="${esc(search)}" oninput="search=this.value;render();this.focus()">
    <table>
      <tr><th>Name</th><th>Email</th><th>Department</th><th>Role</th><th>Salary</th><th>Status</th><th></th></tr>
      ${list.map(e => `<tr>
        <td><b>${esc(e.name)}</b></td><td>${esc(e.email)}</td><td>${esc(e.dept)}</td><td>${esc(e.role)}</td>
        <td>${money(e.salary)}</td>
        <td><span class="badge ${e.status}">${e.status}</span></td>
        <td><button class="btn light" onclick="toggleStatus('${e.id}')">${e.status === 'Active' ? 'Deactivate' : 'Activate'}</button>
            <button class="btn danger" onclick="deleteEmp('${e.id}')">Delete</button></td>
      </tr>`).join('') || '<tr><td colspan="7" class="muted">No employees found.</td></tr>'}
    </table>
    <div class="pager">
      <span>Page ${empPage} of ${pages}</span>
      <span>
        <button class="btn light" ${empPage <= 1 ? 'disabled' : ''} onclick="goPage(${empPage - 1})">Previous</button>
        <button class="btn light" ${empPage >= pages ? 'disabled' : ''} onclick="goPage(${empPage + 1})">Next</button>
      </span>
    </div>
  </div>`;
}
function addEmp(ev) {
  ev.preventDefault();
  const f = new FormData(ev.target);
  const email = String(f.get('email')).trim().toLowerCase();
  if (state.employees.some(e => e.email.toLowerCase() === email)) {
    toast('An employee with this email already exists.', 'error');
    return false;
  }
  const salary = Number(f.get('salary'));
  if (!(salary > 0)) {
    toast('Monthly salary must be greater than zero.', 'error');
    return false;
  }
  state.employees.push({
    id: uid(), name: String(f.get('name')).trim(), email, dept: f.get('dept'),
    role: String(f.get('role')).trim(), salary, status: 'Active'
  });
  save();
  toast('Employee added.');
  render();
  return false;
}
function toggleStatus(id) {
  const e = emp(id);
  e.status = e.status === 'Active' ? 'Inactive' : 'Active';
  save(); render();
}
function deleteEmp(id) {
  askConfirm({ title: 'Delete employee', message: 'Delete this employee and their attendance and leave records?', action: 'Delete' }, () => do_deleteEmp(id));
}
function do_deleteEmp(id) {
  state.employees = state.employees.filter(e => e.id !== id);
  state.attendance = state.attendance.filter(a => a.empId !== id);
  state.leaves = state.leaves.filter(l => l.empId !== id);
  state.goals = state.goals.filter(g => g.empId !== id);
  state.reviews = state.reviews.filter(r => r.empId !== id);

}

/* ---------- Attendance ---------- */
/* ---------- attendance calendar ---------- */
let calMonth = ymd(new Date()).slice(0, 7);
let calEmp = '';          // HR only: '' means all employees
let calDay = null;
function calShift(n) {
  const [y, m] = calMonth.split('-').map(Number);
  calMonth = ymd(new Date(y, m - 1 + n, 1)).slice(0, 7); calDay = null; render();
}
function calToday() { calMonth = today().slice(0, 7); calDay = today(); render(); }
function calPick(d) { calDay = calDay === d ? null : d; render(); }
function calSetEmp(v) { calEmp = v; calDay = null; render(); }
function leaveOn(empId, date, status) {
  return state.leaves.find(l => l.empId === empId && l.status === status && l.from <= date && date <= l.to);
}
function attendanceCalendar() {
  const [y, m] = calMonth.split('-').map(Number);
  const days = new Date(y, m, 0).getDate(), lead = (new Date(y, m - 1, 1).getDay() + 6) % 7;
  const t = today(), target = isHR() ? calEmp : session.empId;
  const monthName = new Date(y, m - 1, 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
  const recs = state.attendance.filter(a => a.date.startsWith(calMonth) && (!target || a.empId === target));
  const byDate = {}; recs.forEach(a => (byDate[a.date] = byDate[a.date] || []).push(a));
  let cells = '', present = 0, onLeave = 0, pending = 0;
  for (let i = 0; i < lead; i++) cells += '<div class="cal-cell cal-empty"></div>';
  for (let d = 1; d <= days; d++) {
    const date = calMonth + '-' + String(d).padStart(2, '0');
    const dow = new Date(y, m - 1, d).getDay(), weekend = dow === 0 || dow === 6, future = date > t;
    let cls = weekend ? 'cal-off' : '', label = weekend ? 'Weekly off' : '';
    const here = byDate[date] || [];
    if (target) {
      const rec = here[0];
      if (rec) { cls = 'cal-p'; label = 'In ' + rec.inTime + (rec.outTime ? '<br>Out ' + rec.outTime : ''); present++; }
      else if (leaveOn(target, date, 'Approved')) { cls = 'cal-l'; label = 'On leave'; onLeave++; }
      else if (leaveOn(target, date, 'Pending')) { cls = 'cal-w'; label = 'Leave pending'; pending++; }
    } else if (here.length) {
      cls = 'cal-p'; label = here.length + ' present';
    }
    const cn = (cls + (date === t ? ' cal-today' : '') + (date === calDay ? ' cal-sel' : '')).trim();
    cells += `<button type="button" class="cal-cell ${cn}" onclick="calPick('${date}')" title="${date}"><span class="d">${d}</span><span class="t">${label}</span></button>`;
  }
  const names = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(n => `<div class="cal-dow">${n}</div>`).join('');
  const picker = isHR() ? `<select onchange="calSetEmp(this.value)" aria-label="Employee"><option value="">All employees</option>${state.employees.map(e => `<option value="${e.id}" ${e.id === calEmp ? 'selected' : ''}>${esc(e.name)}</option>`).join('')}</select>` : '';
  const summary = target ? `<p class="hint">This month: <b>${present}</b> present, <b>${onLeave}</b> on approved leave, <b>${pending}</b> leave pending.</p>` : '';
  return `
  <div class="panel">
    <div class="cal-head">
      <h3>Attendance calendar</h3>
      <button class="btn light" onclick="calShift(-1)" aria-label="Previous month">‹</button>
      <b style="min-width:130px;text-align:center">${monthName}</b>
      <button class="btn light" onclick="calShift(1)" aria-label="Next month">›</button>
      <button class="btn light" onclick="calToday()">Today</button>
      ${picker}
    </div>
    <div class="cal-grid">${names}${cells}</div>
    <div class="cal-legend">
      <span><i style="background:var(--success-soft)"></i>Present</span><span><i style="background:var(--primary-soft)"></i>On leave</span>
      <span><i style="background:var(--warn-soft)"></i>Leave pending</span><span><i style="background:var(--th-bg)"></i>Weekly off</span><span><i></i>No record</span>
    </div>
    ${summary}
    ${calendarDetail(target)}
  </div>`;
}
function calendarDetail(target) {
  if (!calDay) return '<p class="hint">Click a date to see details.</p>';
  const d = calDay, dayRecs = state.attendance.filter(a => a.date === d && (!target || a.empId === target));
  const title = new Date(d + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  if (target) {
    const r = dayRecs[0], lv = leaveOn(target, d, 'Approved') || leaveOn(target, d, 'Pending');
    return `<div style="margin-top:14px"><h3>${title}</h3>` + (r
      ? `<p>Checked in at <b>${r.inTime}</b>${r.outTime ? `, out at <b>${r.outTime}</b> (${hoursBetween(r.inTime, r.outTime)})` : ', not checked out'}.</p>`
      : '<p class="muted">No attendance record for this day.</p>')
      + (lv ? `<p>${esc(lv.type)} leave: <span class="badge ${lv.status}">${lv.status}</span> (${lv.from} to ${lv.to})</p>` : '') + '</div>';
  }
  const leaves = state.leaves.filter(l => l.status === 'Approved' && l.from <= d && d <= l.to);
  return `<div style="margin-top:14px"><h3>${title}</h3>
    <p><b>${dayRecs.length}</b> present, <b>${leaves.length}</b> on approved leave.</p>
    ${dayRecs.length ? `<table><tr><th>Employee</th><th>In</th><th>Out</th></tr>${dayRecs.map(a => `<tr><td>${esc(empName(a.empId))}</td><td>${a.inTime}</td><td>${a.outTime || '-'}</td></tr>`).join('')}</table>` : ''}
    ${leaves.length ? `<p class="hint">On leave: ${leaves.map(l => esc(empName(l.empId))).join(', ')}</p>` : ''}</div>`;
}
function myAttendance() {
  const e = emp(session.empId);
  if (!e) return '<p class="muted">Employee record not found.</p>';
  const t = today();
  const rec = state.attendance.find(a => a.empId === e.id && a.date === t);
  const mine = state.attendance.filter(a => a.empId === e.id).sort((a, b) => b.date.localeCompare(a.date));
  const month = t.slice(0, 7);
  const monthDays = mine.filter(a => a.date.startsWith(month)).length;
  let team = '';
  if (isManager()) {
    const rows = teamOf(e.id).map(m => {
      const r = state.attendance.find(a => a.empId === m.id && a.date === t);
      const onLeave = state.leaves.some(l => l.empId === m.id && l.status === 'Approved' && l.from <= t && t <= l.to);
      const st = r ? '<span class="badge Present">Present</span>' : onLeave ? '<span class="badge Pending">On leave</span>' : '<span class="badge Absent">Not in</span>';
      return `<tr><td><b>${esc(m.name)}</b></td><td>${esc(m.role)}</td><td>${st}</td><td>${r ? r.inTime : '-'}</td><td>${r && r.outTime ? r.outTime : '-'}</td></tr>`;
    }).join('');
    team = `<div class="panel"><h3>My team today <span class="muted" style="font-weight:400">${esc(e.dept)} · ${t}</span></h3>
      <table><tr><th>Employee</th><th>Role</th><th>Status</th><th>In</th><th>Out</th></tr>${rows || '<tr><td colspan="5" class="muted">No team members.</td></tr>'}</table></div>`;
  }
  return `
  <div class="cards">
    <div class="card blue"><div class="label">Today (${t})</div><div class="num" style="font-size:20px">${rec ? 'In at ' + rec.inTime + (rec.outTime ? ', out ' + rec.outTime : '') : 'Not checked in'}</div></div>
    <div class="card green"><div class="label">Days present this month</div><div class="num">${monthDays}</div></div>
  </div>
  <div class="panel">
    <h3>My attendance</h3>
    <button class="btn ok" onclick="checkIn('${e.id}')" ${rec ? 'disabled' : ''}>Check in</button>
    <button class="btn light" onclick="checkOut('${e.id}')" ${!rec || rec.outTime ? 'disabled' : ''}>Check out</button>
  </div>
  ${attendanceCalendar()}
  ${team}
  <div class="panel">
    <h3>My records</h3>
    ${mine.length ? `<table><tr><th>Date</th><th>In</th><th>Out</th><th>Hours</th></tr>
      ${mine.slice(0, 31).map(a => `<tr><td>${a.date}</td><td>${a.inTime}</td><td>${fmtTime(a.outTime)}</td><td>${hoursBetween(a.inTime, a.outTime)}</td></tr>`).join('')}
    </table>` : '<p class="muted">No records yet. Click Check in to start.</p>'}
  </div>`;
}
function attendance() {
  if (!isHR()) return myAttendance();
  const t = today();
  const rows = visibleEmps().map(e => {
    const rec = state.attendance.find(a => a.empId === e.id && a.date === t);
    const action = `<button class="btn ok" onclick="checkIn('${e.id}')" ${rec ? 'disabled' : ''}>Check in</button>
                  <button class="btn light" onclick="checkOut('${e.id}')" ${!rec || rec.outTime ? 'disabled' : ''}>Check out</button>`;
    return `<tr>
      <td><b>${esc(e.name)}</b></td>
      <td>${rec ? `<span class="badge Present">Present</span>` : `<span class="badge Absent">Not in</span>`}</td>
      <td>${rec ? rec.inTime : '-'}</td>
      <td>${rec && rec.outTime ? rec.outTime : '-'}</td>
      <td>${action}</td></tr>`;
  }).join('');
  const history = [...state.attendance].filter(a => isHR() || a.empId === session.empId).reverse().slice(0, 20);
  return `
  ${attendanceCalendar()}
  <div class="panel">
    <h3>Add or correct attendance manually</h3>
    <form class="inline" onsubmit="return manualAttendance(event)">
      <select name="empId" required>${state.employees.map(e => `<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select>
      <input type="date" name="date" value="${t}" max="${t}" required>
      <label class="muted">In <input type="time" name="inTime" required></label>
      <label class="muted">Out <input type="time" name="outTime"></label>
      <button class="btn" type="submit">Save record</button>
    </form>
    <p class="hint">Saving a date that already has a record updates its times. Leave Out empty if the person has not left yet.</p>
  </div>
  <div class="panel">
    <h3>Today <span class="muted" style="font-weight:400">${t}</span></h3>
    <table><tr><th>Employee</th><th>Status</th><th>In</th><th>Out</th><th></th></tr>${rows}</table>
  </div>
  <div class="panel">
    <h3>Recent records</h3>
    ${history.length ? `<table><tr><th>Date</th><th>Employee</th><th>In</th><th>Out</th><th></th></tr>
      ${history.map(a => `<tr><td>${a.date}</td><td>${esc(empName(a.empId))}</td><td>${a.inTime}</td><td>${a.outTime || '-'}</td><td><button class="btn light" onclick="deleteAtt('${a.id}')">Delete</button></td></tr>`).join('')}
    </table>` : '<p class="muted">No attendance yet.</p>'}
  </div>`;
}
function manualAttendance(ev) {
  ev.preventDefault();
  if (!isHR()) return false;
  const f = new FormData(ev.target);
  const empId = f.get('empId'), date = f.get('date'), inTime = f.get('inTime'), outTime = f.get('outTime') || null;
  if (outTime && outTime <= inTime) { toast('Out time must be after the in time.', 'error'); return false; }
  const rec = state.attendance.find(a => a.empId === empId && a.date === date);
  if (rec) { rec.inTime = inTime; rec.outTime = outTime; }
  else state.attendance.push({ id: uid(), empId, date, inTime, outTime });
  save(); toast('Attendance saved.'); render();
  return false;
}
function deleteAtt(id) {
  if (!isHR()) return;
  askConfirm({ title: 'Delete attendance record', message: 'Delete this attendance record?', action: 'Delete' }, () => {
    state.attendance = state.attendance.filter(a => a.id !== id);
    save(); render();
  });
}
function checkIn(empId) {
  if (!isHR() && empId !== session.empId) return;
  const t = today();
  if (state.attendance.some(a => a.empId === empId && a.date === t)) return;
  state.attendance.push({ id: uid(), empId, date: t, inTime: nowTime(), outTime: null });
  save(); render();
}
function checkOut(empId) {
  if (!isHR() && empId !== session.empId) return;
  const rec = state.attendance.find(a => a.empId === empId && a.date === today() && !a.outTime);
  if (!rec) return;
  rec.outTime = nowTime();
  save(); render();
}

/* ---------- Leave ---------- */
const QUOTA = { Casual: 8, Sick: 7, Earned: 15 };
function leaveRow(l, mode) {
  let actions = '';
  if (mode === 'approve' && l.status === 'Pending') actions = `
    <button class="btn ok" onclick="setLeave('${l.id}','Approved')">Approve</button>
    <button class="btn danger" onclick="setLeave('${l.id}','Rejected')">Reject</button>`;
  if (mode === 'mine' && l.status === 'Pending') actions = `<button class="btn light" onclick="cancelLeave('${l.id}')">Cancel</button>`;
  return `<tr>
    <td><b>${esc(empName(l.empId))}</b></td><td>${esc(l.type)}</td><td>${l.from}</td><td>${l.to}</td><td>${leaveDays(l)}</td>
    <td>${esc(l.reason)}</td><td><span class="badge ${l.status}">${l.status}</span></td><td>${actions}</td></tr>`;
}
function leaveTable(list, mode, emptyMsg) {
  return list.length ? `<table>
    <tr><th>Employee</th><th>Type</th><th>From</th><th>To</th><th>Days</th><th>Reason</th><th>Status</th><th></th></tr>
    ${list.map(l => leaveRow(l, mode)).join('')}</table>` : `<p class="muted">${emptyMsg}</p>`;
}
function leave() {
  const empOptions = visibleEmps().map(e => `<option value="${e.id}">${esc(e.name)}</option>`).join('');
  const all = [...state.leaves].reverse();
  const form = `
  <div class="panel">
    <h3>Apply for leave</h3>
    <form class="inline" onsubmit="return applyLeave(event)">
      <select name="empId" required ${isHR() ? '' : 'style="display:none"'}>${empOptions}</select>
      <select name="type">
        <option>Casual</option><option>Sick</option><option>Earned</option><option>Unpaid</option>
      </select>
      <input type="date" name="from" required>
      <input type="date" name="to" required>
      <input name="reason" placeholder="Reason" required>
      <button class="btn" type="submit">Submit request</button>
    </form>
  </div>`;
  if (isHR()) return form + `<div class="panel"><h3>Requests</h3>${leaveTable(all, 'approve', 'No leave requests.')}</div>`;
  const mine = all.filter(l => l.empId === session.empId);
  const used = t => mine.filter(l => l.type === t && l.status === 'Approved').reduce((n, l) => n + leaveDays(l), 0);
  const balance = `<div class="cards">${Object.keys(QUOTA).map(t =>
    `<div class="card"><div class="label">${t} leave left</div><div class="num">${Math.max(0, QUOTA[t] - used(t))} <span class="muted" style="font-size:13px;font-weight:400">of ${QUOTA[t]}</span></div></div>`).join('')}</div>`;
  let approvals = '';
  if (isManager()) {
    const ids = new Set(teamOf(session.empId).map(e => e.id));
    const team = all.filter(l => ids.has(l.empId));
    const pending = team.filter(l => l.status === 'Pending');
    approvals = `<div class="panel"><h3>Team requests awaiting my approval <span class="badge Pending">${pending.length}</span></h3>
      ${leaveTable(pending, 'approve', 'No pending requests from your team.')}</div>
      <div class="panel"><h3>Team leave history</h3>${leaveTable(team.filter(l => l.status !== 'Pending'), 'none', 'Nothing decided yet.')}</div>`;
  }
  return balance + form + approvals + `<div class="panel"><h3>My leave requests</h3>${leaveTable(mine, 'mine', 'You have not applied for leave yet.')}</div>`;
}
function cancelLeave(id) {
  const l = state.leaves.find(x => x.id === id);
  if (!l || l.empId !== session.empId || l.status !== 'Pending') return;
  state.leaves = state.leaves.filter(x => x.id !== id);
  save(); render();
}
function submitLeave(empId, type, from, to, reason) {
  if (to < from) return 'End date must be after the start date.';
  const clash = state.leaves.find(l => l.empId === empId && l.status !== 'Rejected' && from <= l.to && l.from <= to);
  if (clash) return 'This overlaps an existing ' + clash.status.toLowerCase() + ' request for the same employee.';
  state.leaves.push({ id: uid(), empId, type, from, to, reason, status: 'Pending' });
  save();
  return null;
}
function applyLeave(ev) {
  ev.preventDefault();
  const f = new FormData(ev.target);
  if (!isHR()) f.set('empId', session.empId);
  const err = submitLeave(f.get('empId'), f.get('type'), f.get('from'), f.get('to'), f.get('reason'));
  if (err) { toast(err, 'error'); return false; }
  render();
  return false;
}
function setLeave(id, status) {
  const l = state.leaves.find(x => x.id === id);
  if (!l || !canApprove(l)) return;
  l.status = status;
  save(); render();
}

function convertCandidate(id) {
  const c = findCandidate(id);

  const job = state.jobs.find(j => j.id === c.jobId);

    salary: c.offer || 60000, status: 'Active'

/* ---------- ATS insights: skill match, hiring funnel, source of hire ---------- */
const SOURCE_COLORS = ['#0f766e', '#1d4ed8', '#15803d', '#b45309', '#7e22ce', '#94a3b8'];
function parseSkills(s) { return String(s || '').split(',').map(x => x.trim()).filter(Boolean); }
// Skill match = share of the job's required skills the candidate has
function matchInfo(c) {
  const job = state.jobs.find(j => j.id === c.jobId);
  const need = (job && job.skills) || [];
  if (!need.length) return { pct: null, hit: [] };
  const have = (c.skills || []).map(s => s.toLowerCase());
  const hit = need.filter(s => have.includes(s.toLowerCase()));
  return { pct: Math.round(hit.length / need.length * 100), hit };
}
function matchCell(c) {
  const m = matchInfo(c);
  if (m.pct === null) return '<span class="muted">-</span>';
  const cls = m.pct >= 67 ? 'Active' : m.pct >= 34 ? 'Pending' : 'Rejected';
  return `<span class="badge ${cls}" title="${esc(m.hit.join(', ') || 'No matching skills')}">${m.pct}%</span>`;
}
function funnelData() {
  const active = state.candidates.filter(c => c.stage !== 'Rejected');
  const reached = STAGE_ORDER.map((s, k) => active.filter(c => STAGE_ORDER.indexOf(c.stage) >= k).length);
  return { reached, rejected: state.candidates.filter(c => c.stage === 'Rejected').length };
}
function dayGap(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }
function avgTimeToHire() {
  const d = state.candidates.filter(c => c.stage === 'Hired' && c.hiredOn && c.applied)
    .map(c => dayGap(c.applied, c.hiredOn));
  return d.length ? Math.round(d.reduce((s, x) => s + x, 0) / d.length) : null;
}
function sourceCounts() {
  return SOURCES.map(s => ({ label: s, value: state.candidates.filter(c => (c.source || 'Other') === s).length }));
}
function analyticsPanels() {
  const { reached, rejected } = funnelData();
  const total = reached[0] || 0;
  const bars = STAGE_ORDER.map((s, k) => {
    const pct = total ? Math.round(reached[k] / total * 100) : 0;
    const conv = k === 0 || !reached[k - 1] ? '' : `${Math.round(reached[k] / reached[k - 1] * 100)}% moved on from ${STAGE_ORDER[k - 1]}`;
    return `<tr><td style="width:110px"><b>${s}</b></td>
      <td style="white-space:normal;width:50%"><div class="bar" style="width:100%;height:12px"><span style="width:${pct}%"></span></div></td>
      <td>${reached[k]}</td><td class="muted">${conv}</td></tr>`;
  }).join('');
  const slices = sourceCounts().map((x, i) => ({ ...x, color: SOURCE_COLORS[i] }));
  const avg = avgTimeToHire();
  const overall = total ? Math.round(reached[STAGE_ORDER.length - 1] / total * 100) + '%' : '-';
  return `
  <div class="cards">
    <div class="card blue"><div class="label">Average time to hire</div><div class="num">${avg === null ? '-' : avg + ' days'}</div></div>
    <div class="card green"><div class="label">Applicants hired</div><div class="num">${overall}</div></div>
    <div class="card amber"><div class="label">Rejected</div><div class="num">${rejected}</div></div>
  </div>
  <div class="grid2">
    <div class="panel">
      <h3>Hiring funnel</h3>
      <table>${bars}</table>
    </div>
    <div class="panel">
      <h3>Where candidates come from</h3>
      ${pieSvg(slices)}
    </div>
  </div>`;
}
function funnelText() {
  const { reached, rejected } = funnelData();
  return `<p>Hiring funnel (candidates who reached each stage):</p>` +
    listHtml(STAGE_ORDER.map((s, k) => `${s}: ${reached[k]}`)) + `<p>Rejected: ${rejected}</p>`;
}
function sourceText() {
  const rows = sourceCounts().sort((a, b) => b.value - a.value);
  return `<p>Where candidates come from:</p>` + listHtml(rows.map(r => `${esc(r.label)}: ${r.value}`));
}
function topMatchText() {
  const list = state.candidates.filter(c => c.stage !== 'Rejected')
    .map(c => ({ c, m: matchInfo(c) }))
    .filter(x => x.m.pct !== null)
    .sort((a, b) => b.m.pct - a.m.pct).slice(0, 5);
  return `<p>Best skill matches among active candidates:</p>` +
    listHtml(list.map(x => `${esc(x.c.name)} for ${esc(jobTitle(x.c.jobId))}: ${x.m.pct}% match${x.m.hit.length ? ' (' + esc(x.m.hit.join(', ')) + ')' : ''}`));
}

/* ---------- Interview scheduling (ATS) ---------- */
function daysAhead(n) {
  const d = new Date();
  d.setDate(d.getDate() + n);
  return ymd(d);
}
function candName(id) { const c = findCandidate(id); return c ? c.name : 'Removed candidate'; }
function interviewPanels() {
  const open = state.candidates.filter(c => c.stage !== 'Rejected' && c.stage !== 'Hired');
  const candOpts = open.map(c => `<option value="${c.id}">${esc(c.name)} (${esc(jobTitle(c.jobId))})</option>`).join('');
  const empOpts = state.employees.filter(e => e.status === 'Active')
    .map(e => `<option value="${e.id}">${esc(e.name)} (${esc(e.dept)})</option>`).join('');
  const sorted = [...state.interviews].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  const upcoming = state.interviews.filter(i => i.status === 'Scheduled').length;
  const rows = sorted.map(i => {
    const c = findCandidate(i.candId);

      ? `<button class="btn ok" onclick="setInterviewStatus('${i.id}','Completed')">Complete</button>
         <button class="btn light" onclick="setInterviewStatus('${i.id}','Cancelled')">Cancel</button>` : '';

      <td>${esc(empName(i.interviewer))}</td>

      <td><span class="badge ${i.status}">${i.status}</span>${i.feedback ? `<div class="muted" style="font-size:12px;white-space:normal;max-width:220px">${esc(i.feedback)}</div>` : ''}</td>
      <td>${actions} <button class="btn danger" onclick="deleteInterview('${i.id}')">Delete</button></td>
    </tr>`;
  }).join('');
  return `

    <h3>Schedule interview</h3>
    <form class="inline" onsubmit="return addInterview(event)">
      <select name="candId" required>${candOpts}</select>

      <input type="date" name="date" min="${today()}" required>
      <input type="time" name="time" required>
      <select name="mode"><option>Video call</option><option>In person</option><option>Phone</option></select>
      <input name="link" placeholder="Meeting link or room (optional)">
      <button class="btn" type="submit">Schedule</button>
    </form>
  </div>
  <div class="panel">
    <div class="panel-head"><h3>Interview schedule <span class="muted" style="font-weight:400">${upcoming} upcoming</span></h3></div>
    <table>
      <tr><th>Date</th><th>Time</th><th>Candidate</th><th>Interviewer</th><th>Mode</th><th>Status</th><th></th></tr>
      ${rows || '<tr><td colspan="7" class="muted">No interviews scheduled.</td></tr>'}
    </table>
  </div>`;
}
function addInterview(ev) {
  ev.preventDefault();
  const f = new FormData(ev.target);
  const candId = f.get('candId'), interviewer = f.get('interviewer');
  const date = f.get('date'), time = f.get('time');
  const cand = findCandidate(candId);
  if (!cand) { toast('Please choose a candidate.', 'error'); return false; }
  if (date < today()) { toast('Interview date cannot be in the past.', 'error'); return false; }
  const clash = state.interviews.find(i => i.status === 'Scheduled' && i.date === date && i.time === time &&
    (i.interviewer === interviewer || i.candId === candId));
  if (clash) {
    toast(clash.candId === candId
      ? 'This candidate already has an interview at that time.'
      : empName(interviewer) + ' is already booked at that time.', 'error');
    return false;
  }
  state.interviews.push({
    id: uid(), candId, interviewer, date, time, mode: f.get('mode'),
    link: String(f.get('link') || '').trim(), status: 'Scheduled', feedback: ''
  });
  // moving a candidate into the Interview stage automatically
  if (cand.stage === 'Applied' || cand.stage === 'Screening') cand.stage = 'Interview';
  save();
  toast('Interview scheduled with ' + cand.name + '.');
  render();
  return false;
}
function setInterviewStatus(id, status) {
  const i = state.interviews.find(x => x.id === id);
  if (!i) return;
  if (status === 'Completed') {
    const fb = prompt('Interview feedback (optional):', i.feedback || '');
    if (fb === null) return;
    i.feedback = fb.trim();
  }
  i.status = status;
  save();
  toast('Interview marked as ' + status.toLowerCase() + '.');
  render();
}
function deleteInterview(id) {
  askConfirm({ title: 'Delete interview', message: 'Delete this interview?', action: 'Delete' }, () => do_deleteInterview(id));
}
function do_deleteInterview(id) {
  state.interviews = state.interviews.filter(i => i.id !== id);
  save(); toast('Interview deleted.'); render();
}

/* ---------- Performance explanations (PMS) ---------- */
// Score = 60% manager rating + 40% average goal progress (goal progress alone if not yet rated)
const PERF_BANDS = [
  { min: 75, name: 'Excellent', cls: 'Active' },
  { min: 60, name: 'Good', cls: 'Scheduled' },
  { min: 40, name: 'Needs improvement', cls: 'Pending' },

];
const PERF_ACTIONS = {
  Excellent: 'Recognise the achievement and discuss stretch work or a promotion path.',
  Good: 'Keep the current pace and agree one stretch goal for the next cycle.',
  'Needs improvement': 'Agree a 30-day improvement plan with clear milestones and weekly check-ins.',
  Low: 'Hold a one-to-one to find blockers, add support or training, and review progress in 30 days.'
};
let explainId = null;

function perfExplain(empId) {
  const e = emp(empId);
  const gs = state.goals.filter(g => g.empId === empId);
  const rv = state.reviews.find(r => r.empId === empId);
  const rated = rv && rv.rating ? rv.rating : 0;
  const avgP = gs.length ? gs.reduce((s, g) => s + g.progress, 0) / gs.length : 0;
  const score = Math.round(rated ? 0.6 * (rated / 5 * 100) + 0.4 * avgP : avgP);
  const band = PERF_BANDS.find(b => score >= b.min);
  const strengths = [], concerns = [];

  if (gs.length && avgP >= 80) strengths.push(`Strong goal delivery, averaging ${Math.round(avgP)}% completion`);
  const strong = gs.filter(g => g.progress >= 90);
  if (strong.length) strengths.push(`Completed ${strong.length} goal(s) at 90% or more`);
  if (rated >= 4) strengths.push(`Manager rating of ${rated} / 5`);

  if (!gs.length) concerns.push('No goals set for this cycle');
  else if (avgP < 40) concerns.push(`Goal progress is low, averaging ${Math.round(avgP)}%`);
  const weak = gs.filter(g => g.progress < 40);
  if (weak.length) concerns.push(`${weak.length} goal(s) below 40%: ${weak.map(g => g.title).join(', ')}`);
  if (rated && rated <= 2) concerns.push(`Manager rating of ${rated} / 5`);
  if (!rated) concerns.push('Manager review not completed yet');

  return {
    id: empId, name: e ? e.name : 'Unknown', score, band, avgP, rated, strengths, concerns,
    headline: strengths[0] || concerns[0] || 'No data yet',
    action: PERF_ACTIONS[band.name], comment: rv ? (rv.comment || '') : ''
  };
}
function explainCard(ex) {
  const reasons = ex.strengths.map(s => '&#10004; ' + esc(s)).concat(ex.concerns.map(c => '&#9888; ' + esc(c)));
  return `<div class="answer" style="margin-top:0">
    <p><b>${esc(ex.name)}</b>: score ${ex.score} / 100 <span class="badge ${ex.band.cls}">${ex.band.name}</span></p>
    <p style="margin-top:10px"><b>Reasons</b></p>
    ${listHtml(reasons)}
    <p style="margin-top:12px"><b>Suggested action:</b> ${esc(ex.action)}</p>
    <div style="margin-top:12px">
      <label class="muted" style="font-size:12px">Manager comment (saved automatically)</label>
      <textarea rows="2" style="width:100%;margin-top:4px;padding:8px 10px;border:1px solid #d6dce8;border-radius:8px;font-family:inherit"
        onchange="setComment('${ex.id}', this.value)">${esc(ex.comment)}</textarea>

}

/* ---------- Performance charts: pie charts built on the explanations above ---------- */
const BAND_COLORS = { Excellent: '#15803d', Good: '#1d4ed8', 'Needs improvement': '#b45309', Low: '#b91c1c' };

function pieSvg(slices, size = 180) {
  const total = slices.reduce((s, x) => s + x.value, 0);
  if (!total) return '<p class="muted">No data to chart.</p>';
  const r = size / 2, c = size / 2;
  let angle = -Math.PI / 2, paths = '';
  slices.forEach(s => {
    if (!s.value) return;
    const frac = s.value / total;
    if (frac >= 0.9999) {
      paths += `<circle cx="${c}" cy="${c}" r="${r}" fill="${s.color}"><title>${esc(s.label)}: ${s.value}</title></circle>`;
      return;
    }
    const a2 = angle + frac * 2 * Math.PI;
    const x1 = c + r * Math.cos(angle), y1 = c + r * Math.sin(angle);
    const x2 = c + r * Math.cos(a2), y2 = c + r * Math.sin(a2);
    const large = frac > 0.5 ? 1 : 0;
    paths += `<path d="M${c},${c} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${s.color}"><title>${esc(s.label)}: ${Math.round(frac * 100)}%</title></path>`;
    angle = a2;
  });
  const legend = slices.filter(s => s.value).map(s =>
    `<li><span class="sw" style="background:${s.color}"></span>${esc(s.label)}: <b>${Math.round(s.value / total * 100)}%</b></li>`).join('');
  return `<div class="pie"><svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="Pie chart">${paths}</svg><ul class="legend">${legend}</ul></div>`;
}

// Pie of how an employee's score is built, using the same formula as perfExplain
function individualSlices(ex) {
  const rp = ex.rated ? ex.rated / 5 * 100 : 0;
  if (!ex.rated && ex.avgP === 0) return [{ label: 'No data yet', value: 100, color: '#e2e8f0' }];
  const slices = ex.rated
    ? [{ label: 'Goal progress (40% weight)', value: 0.4 * ex.avgP, color: '#0f766e' },
       { label: 'Manager rating (60% weight)', value: 0.6 * rp, color: '#1d4ed8' }]
    : [{ label: 'Goal progress', value: ex.avgP, color: '#0f766e' }];
  const earned = slices.reduce((s, x) => s + x.value, 0);
  slices.push({ label: 'Not yet earned', value: Math.max(0, 100 - earned), color: '#e2e8f0' });
  return slices;
}

const RISK_COLORS = { High: '#b91c1c', Medium: '#b45309', Low: '#15803d' };
const RISK_BADGE = { High: 'Rejected', Medium: 'Pending', Low: 'Active' };
const RISK_ACTION = {
  High: 'Hold a retention conversation this week and review pay and growth options',
  Medium: 'Check in one-to-one and confirm career goals for the next cycle',
  Low: 'No action needed; keep regular check-ins'
};
let radarEmpId = null;
let radarRaise = 0;
let radarDept = 'All';
function setRadarEmp(v) { radarEmpId = v; radarRaise = 0; render(); }
function setRaise(v) { radarRaise = Number(v) || 0; render(); }

function exportRadar() {
  exportCSV('retention-risk.csv', ['Name', 'Department', 'Role', 'Score', 'Level', 'Reasons', 'Suggested action'],
    radarActive(radarDept).map(x => [x.e.name, x.e.dept, x.e.role, x.r.score, x.r.level, x.r.reasons.join('; '), RISK_ACTION[x.r.level]]));
  toast('Retention list exported.');
}

function deptAvgSalary(dept) {
  const list = state.employees.filter(e => e.dept === dept);
  return list.length ? list.reduce((s, e) => s + e.salary, 0) / list.length : 0;
}
// Each signal adds points, so every score can be explained to HR
function retentionRisk(e, salary = e.salary) {
  const ex = perfExplain(e.id);
  const reasons = [];
  let score = 0;
  if (ex.score < 40) { score += 35; reasons.push('Low performance score (' + Math.round(ex.score) + ' / 100)'); }
  const avg = deptAvgSalary(e.dept);
  if (avg && salary < avg * 0.85) {
    score += 25;
    reasons.push('Salary is ' + Math.round((1 - salary / avg) * 100) + '% below the ' + e.dept + ' average');
  }
  const leaves = state.leaves.filter(l => l.empId === e.id).length;
  if (leaves >= 2) { score += 15; reasons.push(leaves + ' leave requests on record'); }
  if (!ex.rated) { score += 10; reasons.push('No manager review completed yet'); }
  score = Math.min(100, score);
  const level = score >= 50 ? 'High' : score >= 25 ? 'Medium' : 'Low';
  return { score, level, reasons };
}
function radarActive(dept = 'All') {
  return state.employees.filter(e => e.status === 'Active' && (dept === 'All' || e.dept === dept))
    .map(e => ({ e, r: retentionRisk(e) }))
    .sort((a, b) => b.r.score - a.r.score);
}

  return `

  </div>
  <div class="panel">

      <h3>Risk distribution <span class="muted" style="font-weight:400">${radarDept === 'All' ? 'company-wide' : esc(radarDept)}</span></h3>
      <select onchange="setRadarDept(this.value)">${deptOpts}</select>

  </div>`;
}
