const HELP_TEXT = `<p>I can answer questions about employees, attendance, leave, and payroll. Click a suggestion above or ask in your own words, for example "who is absent today?" or "leave for Aarav". If a name matches more than one person, I will ask you for the full name.</p>`;

function answerQuestion(raw) {
  const q = ' ' + raw.toLowerCase().replace(/'s\b/g, '').replace(/[^a-z0-9@.\s]/g, ' ').replace(/\s+/g, ' ').trim() + ' ';
  const words = q.trim().split(' ');
  const has = (...keys) => keys.some(k => words.some(w => w.startsWith(k)));

  // 1. Greetings and help
  let who = findEmployees(q);
  if (!who.length && words.some(w => ['hi', 'hello', 'hey', 'help'].includes(w))) return HELP_TEXT;

  // 2. Narrow an ambiguous first name using a department in the question, or ask for the full name
  const deptNamed = DEPTS.find(d => q.includes(' ' + d.toLowerCase() + ' '));
  if (who.length > 1 && deptNamed) who = who.filter(e => e.dept === deptNamed);
  if (who.length > 1) {
    return `<p>${who.length} employees match that name. Please use the full name or email:</p>` +
      listHtml(who.map(e => `${esc(e.name)} (${esc(e.dept)}, ${esc(e.email)})`));
  }

  // 3. "my" / "I" means the person chosen in the chat box; pronouns mean the last employee discussed
  if (!who.length && currentEmpId && emp(currentEmpId) && words.some(w => ['my', 'mine', 'i'].includes(w))) {
    who = [emp(currentEmpId)];
  }
  if (!who.length && words.some(w => PRONOUNS.includes(w)) && lastEmpId && emp(lastEmpId)) {
    who = [emp(lastEmpId)];
  }
  const e = who[0] || null;
  if (e) lastEmpId = e.id;

  // 3f. Calls (ATS)
  if (!e && has('call')) return callText();

  // 3e. ATS insights
  if (!e && has('funnel', 'conversion', 'stages', 'stage')) return funnelText();
  if (!e && has('source', 'referral', 'linkedin', 'campus', 'walk', 'origin', 'channel') || (!e && words.includes('come') && words.includes('from'))) return sourceText();
  if (!e && has('match', 'fit', 'suitable', 'qualified')) return topMatchText();
  if (!e && has('time') && has('hire', 'hiring')) {
    const avg = avgTimeToHire();
    return avg === null ? '<p>No completed hires with dates yet.</p>' : `<p>Average time to hire is <b>${avg} days</b> from application to hire.</p>`;
  }

  // 3a. Interview schedule (ATS)
  if (!e && has('interview')) {
    const isToday = has('today');
    const list = state.interviews
      .filter(i => i.status === 'Scheduled' && (!isToday || i.date === today()))
      .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
    const label = isToday ? 'interview(s) scheduled today' : 'upcoming interview(s)';
    return `<p><b>${list.length}</b> ${label}.</p>` +
      listHtml(list.map(i => `${i.date} ${i.time}: ${esc(candName(i.candId))} with ${esc(empName(i.interviewer))} (${esc(i.mode)})`));
  }

  // 3d. Retention radar (attrition risk)
  if (has('attrit', 'retention', 'churn', 'resign', 'quit', 'leaving', 'flight', 'turnover')) {
    if (e) {
      const r = retentionRisk(e);
      return `<p><b>${esc(e.name)}</b> has <b>${r.level.toLowerCase()}</b> retention risk (score ${r.score} / 100).</p>` +
        listHtml(r.reasons.length ? r.reasons.map(x => esc(x)) : ['No risk signals found']);
    }
    const high = radarActive().filter(x => x.r.level === 'High');
    return `<p><b>${high.length}</b> employee(s) at high retention risk.</p>` +
      listHtml(high.slice(0, 10).map(x => `${esc(x.e.name)} (${esc(x.e.dept)}): ${esc(x.r.reasons.join('; '))}`));
  }

  // 3c. Performance explanations (PMS)
  const perfWords = ['perform', 'performance', 'performing', 'explain', 'why', 'reason', 'reasons',
                     'good', 'strong', 'excellent', 'low', 'poor', 'weak', 'underperforming', 'struggling'];
  if (e && words.some(w => perfWords.includes(w) || w.startsWith('perform'))) {
    const ex = perfExplain(e.id);
    return `<p><b>${esc(e.name)}</b> is performing <b>${ex.band.name.toLowerCase()}</b> (score ${ex.score} / 100).</p>` +
      listHtml(ex.strengths.map(s => 'Strength: ' + esc(s)).concat(ex.concerns.map(c => 'Concern: ' + esc(c)))) +
      `<p style="margin-top:8px">Suggested action: ${esc(ex.action)}</p>`;
  }
  if (!e && words.some(w => ['low', 'poor', 'weak', 'underperforming', 'underperformers', 'struggling'].includes(w))) {
    return lowPerformersHtml();
  }
  if (!e && words.some(w => ['good', 'strong', 'excellent', 'top', 'best'].includes(w)) &&
      words.some(w => ['performer', 'performers', 'performance', 'performing'].includes(w))) {
    return topPerformersHtml();
  }

  // 3b. Recruitment (ATS) and performance (PMS)
  if (!e && has('job', 'opening', 'vacanc', 'hiring', 'position')) {
    const open = state.jobs.filter(j => j.status === 'Open');
    return `<p><b>${open.length}</b> open job(s).</p>` +
      listHtml(open.map(j => `${esc(j.title)} (${esc(j.dept)}, ${esc(j.location)}): ${j.openings} opening(s)`));
  }
  if (!e && has('candidate', 'applicant', 'interview', 'offer', 'hired', 'pipeline')) {
    return `<p>Candidate pipeline for ${state.candidates.length} applicant(s):</p>` +
      listHtml(STAGES.map(s => `${s}: ${state.candidates.filter(c => c.stage === s).length}`));
  }
  if (has('goal', 'review', 'rating', 'appraisal', 'performance', 'kpi', 'progress')) {
    if (e) {
      const gs = state.goals.filter(g => g.empId === e.id);
      const rv = state.reviews.find(r => r.empId === e.id);
      const reviewText = rv && rv.rating ? `rated ${rv.rating} / 5 in the Q4 2026 review` : 'review not completed yet';
      return `<p><b>${esc(e.name)}</b> is ${reviewText}.</p>` +
        listHtml(gs.map(g => `${esc(g.title)}: ${g.progress}% complete`));
    }
    const avgP = Math.round(state.goals.reduce((s, g) => s + g.progress, 0) / Math.max(state.goals.length, 1));
    return `<p>Average manager rating is <b>${avgRating() ? avgRating().toFixed(2) : 'not available'}</b> / 5 across completed reviews. Average goal progress is <b>${avgP}%</b>.</p>`;
  }

  // 4. Company-wide questions
  if (has('overlap', 'conflict', 'clash', 'double')) return overlapHtml();
  if (!e && has('pending', 'approv', 'waiting', 'awaiting')) return pendingHtml();
  if (!e && has('summary', 'overview', 'report')) return summaryHtml();
  if (!e && has('inactive', 'deactivated')) {
    const list = state.employees.filter(x => x.status === 'Inactive');
    return `<p><b>${list.length}</b> inactive employee(s).</p>` + listHtml(list.map(x => `${esc(x.name)} (${esc(x.dept)})`));
  }

  // 5. Attendance (per employee or company-wide)
  if (e && has('present', 'checked', 'check', 'attendance', 'absent', 'forgot')) return attendanceForEmp(e);
  if (!e && (has('forgot', 'missing') || (words.includes('out') && has('check')))) return forgotHtml();
  if (!e && has('absent', 'absence')) return absentHtml();
  if (!e && has('present', 'checked', 'check', 'attendance')) return checkedInHtml();

  // 6. Payroll
  if (has('payroll', 'salary', 'pay', 'net', 'gross', 'pf', 'ctc', 'income', 'package', 'earn')) {
    if (e) return payslipHtml(e);
    if (has('highest', 'top', 'max', 'most', 'richest')) return rankHtml(true);
    if (has('lowest', 'min', 'least')) return rankHtml(false);
    if (has('average', 'avg', 'mean')) return averageSalaryHtml();
    return totalPayrollHtml();
  }

  // 7. Leave
  if (has('leave', 'holiday', 'vacation', 'time off')) {
    if (has('apply', 'submit', 'request')) {
      return `<p>To apply for leave, open the <b>Leave</b> page from the sidebar, choose the employee, leave type, dates, and reason, then click Submit request. HR will approve or reject it there.</p>`;
    }
    if (e) return has('balance', 'left', 'remaining', 'available') ? balanceHtml(e) : leaveForEmp(e);
    return leaveSummaryHtml();
  }

  // 8. Departments and headcount
  if (!e && deptNamed) return deptHtml(deptNamed);
  if (!e && has('department', 'dept', 'team')) return deptCountsHtml();
  if (!e && has('how many', 'count', 'total', 'headcount', 'number')) {
    if (has('active')) return `<p><b>${state.employees.filter(x => x.status === 'Active').length}</b> active employees.</p>`;
    return `<p><b>${state.employees.length}</b> employees in total.</p>`;
  }

  // 9. A named employee with no specific topic: show their profile
  if (e) return profileHtml(e);

  return `<p>Sorry, I did not understand that. Try one of the suggestions above, or include an employee's name, a department, or a topic such as leave, attendance, or payroll.</p>`;
}

const ENTITLEMENT = QUOTA;   // one set of leave quotas for the whole app
function daysBetween(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000) + 1; }
function balanceHtml(e) {

/* ---------- personal AI agent for employees and managers ----------
   It only sees the signed-in person's own data (plus the team's pending leave for managers).
   It never changes anything until the person clicks Yes. */
let pendingAgent = null;
function agentHelp(first) {
  const e = emp(session.empId);
  return `<p>${first ? 'Hi ' + esc(e ? e.name.split(' ')[0] : 'there') + '! I am your HR assistant. ' : ''}I can help with your own records. Try:</p>` + listHtml([
    '"Check in" or "Check out"',
    '"Apply sick leave from 2026-11-05 to 2026-11-06 because fever"',
    '"Apply casual leave tomorrow"',
    '"My leave balance"',
    '"My attendance"',
    '"My leave requests"'
  ].concat(isManager() ? ['"Pending approvals" (your team)'] : []));
}
function agentPropose(kind, data, text) {
  pendingAgent = { kind, data };
  return `<p>${text}</p><p><button class="btn ok" onclick="agentDo(true)">Yes, do it</button> <button class="btn light" onclick="agentDo(false)">No</button></p>`;
}
function agentSay(html) { botLog.push({ from: 'bot', html }); botRenderLog(); }
function agentDo(yes) {
  const p = pendingAgent; pendingAgent = null;
  if (!p) return agentSay('<p>Nothing to confirm right now.</p>');
  if (!yes) return agentSay('<p>Okay, I did not change anything.</p>');
  if (p.kind === 'checkin') { checkIn(session.empId); return agentSay(`<p>Done. You are checked in at ${nowTime()}.</p>`); }
  if (p.kind === 'checkout') { checkOut(session.empId); return agentSay(`<p>Done. You are checked out at ${nowTime()}.</p>`); }
  if (p.kind === 'leave') {
    const d = p.data, err = submitLeave(session.empId, d.type, d.from, d.to, d.reason);
    if (err) return agentSay(`<p>I could not submit it: ${esc(err)}</p>`);
    render();
    return agentSay(`<p>Done. Your ${esc(d.type)} leave request is submitted and waiting for approval.</p>`);
  }
}
function agentDecide(id, status) {
  const l = state.leaves.find(x => x.id === id);
  if (!l || !canApprove(l) || l.status !== 'Pending') return agentSay('<p>That request is not available to you.</p>');
  setLeave(id, status);
  agentSay(`<p>${status} ${esc(empName(l.empId))}'s ${esc(l.type)} leave (${l.from} to ${l.to}).</p>`);
}
function agentDates(text) {
  const iso = text.match(/\d{4}-\d{2}-\d{2}/g) || [];
  const day = n => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); };
  let from = iso[0] || null, to = iso[1] || null;
  if (!from && /\btomorrow\b/.test(text)) from = day(1);
  if (!from && /\btoday\b/.test(text)) from = day(0);
  const n = text.match(/(\d+)\s*days?\b/);
  if (from && !to && n && +n[1] > 1) { const d = new Date(from); d.setDate(d.getDate() + +n[1] - 1); to = ymd(d); }
  return from ? { from, to: to || from } : null;
}
function agentAnswer(raw) {
  const q = raw.toLowerCase().trim();
  const me = emp(session.empId);
  if (!me) return '<p>I cannot find your employee record.</p>';
  const t = today();
  // privacy: nothing about other people, pay, or ID numbers
  const other = state.employees.some(e => e.id !== me.id && q.includes(e.name.toLowerCase()));
  if (other || /salary|payroll|payslip|aadhaar|aadhar|\bpan\b|bank|ctc/.test(q))
    return '<p>Sorry, I can only share your own attendance and leave. For anything else, please contact HR.</p>';
  if (/\b(check|clock|punch)[ -]?in\b/.test(q)) {
    const rec = state.attendance.find(a => a.empId === me.id && a.date === t);
    if (rec) return `<p>You are already checked in today (at ${rec.inTime}).</p>`;
    return agentPropose('checkin', {}, `Check you in now at ${nowTime()}?`);
  }
  if (/\b(check|clock|punch)[ -]?out\b/.test(q)) {
    const rec = state.attendance.find(a => a.empId === me.id && a.date === t);
    if (!rec) return '<p>You have not checked in today, so there is nothing to check out of.</p>';
    if (rec.outTime) return `<p>You already checked out today (at ${rec.outTime}).</p>`;
    return agentPropose('checkout', {}, `Check you out now at ${nowTime()}?`);
  }
  if (/\b(apply|take|request|book)\b/.test(q) && /leave|off\b|holiday/.test(q) || /\b(casual|sick|earned|unpaid)\b.*\bleave\b/.test(q) && /\b(apply|take)\b/.test(q)) {
    const type = /sick|\bsl\b|fever|ill\b/.test(q) ? 'Sick' : /earned|privilege|\bel\b/.test(q) ? 'Earned' : /unpaid|\blop\b|loss of pay/.test(q) ? 'Unpaid' : 'Casual';
    const dates = agentDates(q);
    if (!dates) return '<p>Which dates? For example: "Apply sick leave from 2026-11-05 to 2026-11-06 because fever", or "Apply casual leave tomorrow".</p>';
    if (dates.to < dates.from) return '<p>The end date is before the start date. Please check the dates.</p>';
    const rm = raw.match(/(?:because|reason[: ]+)\s*(.+)$/i);
    const reason = rm ? rm[1].trim() : 'Requested via assistant';
    const days = daysBetween(dates.from, dates.to);
    return agentPropose('leave', { type, from: dates.from, to: dates.to, reason },
      `Apply for <b>${type}</b> leave from <b>${dates.from}</b> to <b>${dates.to}</b> (${days} day${days > 1 ? 's' : ''}). Reason: ${esc(reason)}.`);
  }
  if (isManager() && /pending|approv|team/.test(q)) {
    const list = state.leaves.filter(l => l.status === 'Pending' && canApprove(l));
    if (!list.length) return '<p>No pending leave requests from your team.</p>';
    return `<p>${list.length} pending request${list.length > 1 ? 's' : ''} from your team:</p>` + list.map(l =>
      `<p><b>${esc(empName(l.empId))}</b>: ${esc(l.type)}, ${l.from} to ${l.to}. ${esc(l.reason)}<br>
       <button class="btn ok" onclick="agentDecide('${l.id}','Approved')">Approve</button> <button class="btn danger" onclick="agentDecide('${l.id}','Rejected')">Reject</button></p>`).join('');
  }
  if (/balance|left|remaining|how many/.test(q)) return balanceHtml(me);
  if (/attendance|present|today|worked|hours/.test(q)) {
    const rec = state.attendance.find(a => a.empId === me.id && a.date === t);
    const month = state.attendance.filter(a => a.empId === me.id && a.date.startsWith(t.slice(0, 7))).length;
    return `<p>Today (${t}): ${rec ? 'checked in at ' + rec.inTime + (rec.outTime ? ', out at ' + rec.outTime : ', not checked out yet') : 'not checked in'}.</p><p>Days present this month: <b>${month}</b>.</p>`;
  }
  if (/leave|request|status/.test(q)) {
    const mine = state.leaves.filter(l => l.empId === me.id).slice(-5).reverse();
    return mine.length ? '<p>Your latest leave requests:</p>' + listHtml(mine.map(l => `${esc(l.type)}, ${l.from} to ${l.to}: <b>${l.status}</b>`)) : '<p>You have no leave requests yet.</p>';
  }
  return agentHelp(false);
}
function botAnswer(text) {
  let a = answerQuestion(text);
  if (a.includes('did not understand')) {
    a += '<p>For anything else, please contact HR directly, or try asking about leave, attendance, payroll, or a colleague\'s role.</p>';
  }
  return a;
}

const PASSWORDS = { hr: '123', employee: '456', manager: '789' };

try { session = JSON.parse(sessionStorage.getItem('hrms-session')); } catch (e) {}
function isHR() { return !session || session.role === 'hr'; }

function teamOf(id) {

  return m ? state.employees.filter(e => e.dept === m.dept && e.id !== m.id && e.status === 'Active') : [];

function hoursBetween(a, b) {
  if (!a || !b) return '-';
  const m = (parseInt(b.slice(0, 2)) * 60 + parseInt(b.slice(3))) - (parseInt(a.slice(0, 2)) * 60 + parseInt(a.slice(3)));
  return m > 0 ? (m / 60).toFixed(1) + ' h' : '-';

}
function doLogin(ev) {
  ev.preventDefault();
  const role = document.getElementById('login-role').value;
  const pass = document.getElementById('login-pass').value;
  if (pass !== PASSWORDS[role]) { document.getElementById('login-err').textContent = 'Wrong password. Please try again.'; return false; }
  session = { role, empId: role !== 'hr' ? document.getElementById('login-emp').value : null };
  sessionStorage.setItem('hrms-session', JSON.stringify(session));
  document.getElementById('login-pass').value = '';
  document.getElementById('login-err').textContent = '';
  view = 'dashboard';
  botLog = []; pendingAgent = null;
  applySession(); render();
  return false;
}
function logout() {
  session = null;
  botLog = []; pendingAgent = null;
  if (botOpen) toggleBot();
  sessionStorage.removeItem('hrms-session');
  applySession();
}
function myDashboard() {
  const e = emp(session.empId);
  if (!e) return '<p class="muted">Employee record not found.</p>';
  const t = today();
  const rec = state.attendance.find(a => a.empId === e.id && a.date === t);
  const mine = state.leaves.filter(l => l.empId === e.id);
  const count = st => mine.filter(l => l.status === st).length;
  return `
  <div class="cards">
    <div class="card"><div class="label">Department</div><div class="num" style="font-size:20px">${esc(e.dept)}</div></div>
    <div class="card blue"><div class="label">Today</div><div class="num" style="font-size:20px">${rec ? 'In at ' + rec.inTime : 'Not checked in'}</div></div>
    <div class="card amber"><div class="label">Pending leave</div><div class="num">${count('Pending')}</div></div>
    <div class="card green"><div class="label">Approved leave</div><div class="num">${count('Approved')}</div></div>
    ${isManager() ? `<div class="card amber"><div class="label">Team requests to approve</div><div class="num">${state.leaves.filter(l => l.status === 'Pending' && canApprove(l)).length}</div></div>` : ''}
  </div>
  <div class="panel">
    <h3>My details</h3>
    <table>
      <tr><th>Name</th><td>${esc(e.name)}</td></tr>
      <tr><th>Role</th><td>${esc(e.role)}</td></tr>
      <tr><th>Email</th><td>${esc(e.email)}</td></tr>
    </table>
    <p class="hint">Use Attendance to check in or out, and Leave to apply for time off${isManager() ? ' and to approve your team\'s requests' : ''}.</p>
  </div>`;
}

/* ---------- design assistant: changes how the app looks, saved in this browser ---------- */
const DESIGN_KEY = 'hrms-design';
const ACCENTS = {
  teal:   { p: '#0f766e', h: '#115e59', s: '#f0fdfa', a: '#14b8a6', l: '#5eead4', d: '#2dd4bf' },
  blue:   { p: '#1d4ed8', h: '#1e40af', s: '#eff6ff', a: '#3b82f6', l: '#93c5fd', d: '#60a5fa' },
  purple: { p: '#7e22ce', h: '#6b21a8', s: '#faf5ff', a: '#a855f7', l: '#d8b4fe', d: '#c084fc' },
  rose:   { p: '#be123c', h: '#9f1239', s: '#fff1f2', a: '#f43f5e', l: '#fda4af', d: '#fb7185' },
  orange: { p: '#c2410c', h: '#9a3412', s: '#fff7ed', a: '#f97316', l: '#fdba74', d: '#fb923c' }
};
const ACCENT_WORDS = { teal: 'teal|green|default', blue: 'blue|navy', purple: 'purple|violet|indigo', rose: 'rose|pink|red|crimson', orange: 'orange|amber|yellow|gold' };
const DESIGN_DEFAULT = { accent: 'teal', dark: false, size: 100, compact: false, round: 12 };
let design = (() => { try { return Object.assign({}, DESIGN_DEFAULT, JSON.parse(localStorage.getItem(DESIGN_KEY))); } catch (e) { return { ...DESIGN_DEFAULT }; } })();
let designHistory = [];
let designOpen = false;
let designLog = [];
function applyDesign() {
  const a = ACCENTS[design.accent] || ACCENTS.teal, r = document.documentElement.style, b = document.body;
  const set = (k, v) => r.setProperty(k, v);
  b.classList.toggle('dark', design.dark);
  b.classList.toggle('compact', design.compact);
  set('--primary', design.dark ? a.d : a.p); set('--primary-hover', design.dark ? a.p : a.h);
  set('--primary-soft', design.dark ? 'color-mix(in srgb, ' + a.p + ' 22%, #111a2c)' : a.s);
  set('--grad-a', a.a); set('--accent-light', a.l); set('--radius', design.round + 'px');
  const d = design.dark;
  set('--bg', d ? '#0b1220' : '#f5f7fa'); set('--surface', d ? '#111a2c' : '#ffffff'); set('--border', d ? '#243049' : '#e5e9f2');
  set('--text', d ? '#e2e8f0' : '#1e293b'); set('--muted', d ? '#94a3b8' : '#64748b'); set('--faint', d ? '#64748b' : '#94a3b8');
  set('--side', d ? '#050a14' : '#0f172a'); set('--th-bg', d ? '#162033' : '#f8fafc');
  set('--input-bg', d ? '#0f172a' : '#fff'); set('--input-border', d ? '#33415c' : '#d6dce8');
  set('--success-soft', d ? '#14301f' : '#dcfce7'); set('--warn-soft', d ? '#3a2a0b' : '#fef3c7'); set('--danger-soft', d ? '#3b1414' : '#fee2e2');
  document.documentElement.style.zoom = design.size === 100 ? '' : design.size / 100;
}
function saveDesign() { try { localStorage.setItem(DESIGN_KEY, JSON.stringify(design)); } catch (e) {} }
function designReply(raw) {
  const q = raw.toLowerCase();
  const prev = { ...design };
  const done = [];
  if (/\b(reset|default|original|start over)\b/.test(q) && !/default size/.test(q)) {
    design = { ...DESIGN_DEFAULT }; done.push('Back to the original look.');
  } else if (/\bundo\b|go back|revert/.test(q)) {
    const last = designHistory.pop();
    if (!last) return '<p>Nothing to undo.</p>';
    design = last; applyDesign(); saveDesign();
    return '<p>Undone.</p>';
  } else {
    for (const [name, words] of Object.entries(ACCENT_WORDS)) {
      if (new RegExp('\\b(' + words + ')\\b').test(q)) { design.accent = name; done.push('Theme colour: <b>' + name + '</b>.'); break; }
    }
    if (/\b(dark|night|black)\b/.test(q)) { design.dark = true; done.push('Dark mode on.'); }
    else if (/\b(light mode|light theme|bright|day mode|white background)\b/.test(q)) { design.dark = false; done.push('Light mode on.'); }
    if (/\b(normal size|default size|normal text)\b/.test(q)) { design.size = 100; done.push('Text size: normal.'); }
    else if (/\b(bigger|larger|increase|zoom in|big)\b/.test(q)) { design.size = Math.min(130, design.size + 10); done.push('Text size: ' + design.size + '%.'); }
    else if (/\b(smaller|decrease|zoom out|small)\b/.test(q)) { design.size = Math.max(85, design.size - 10); done.push('Text size: ' + design.size + '%.'); }
    if (/\b(compact|dense|tight)\b/.test(q)) { design.compact = true; done.push('Compact spacing.'); }
    else if (/\b(spacious|comfortable|relaxed|roomy)\b/.test(q)) { design.compact = false; done.push('Comfortable spacing.'); }
    if (/\b(rounder|more round|rounded|pill)\b/.test(q)) { design.round = 20; done.push('Rounder corners.'); }
    else if (/\b(square|sharp|less round)\b/.test(q)) { design.round = 4; done.push('Sharper corners.'); }
    else if (/\bnormal corners\b/.test(q)) { design.round = 12; done.push('Normal corners.'); }
  }
  if (!done.length) return `<p>I can change the look of the app. Try:</p>` + listHtml(['"Dark mode"', '"Blue theme"', '"Make the text bigger"', '"Compact"', '"Rounder corners"', '"Dark mode with purple theme"', '"Undo" or "Reset"']);
  designHistory.push(prev); if (designHistory.length > 20) designHistory.shift();
  applyDesign(); saveDesign();
  return '<p>' + done.join(' ') + ' Say "undo" to go back.</p>';
}
function designRender() {
  if (!designLog.length) designLog.push({ from: 'bot', html: '<p>Hi! I am the design assistant. Tell me how you want the app to look, for example <b>"dark mode with a blue theme"</b>, or tap a button below. Your choice is saved on this device.</p>' });
  const el = document.getElementById('design-log');
  el.innerHTML = designLog.map(m => `<div class="msg ${m.from}">${m.html}</div>`).join('');
  el.scrollTop = el.scrollHeight;
}
function designSend(text) {
  designLog.push({ from: 'me', html: esc(text) });
  designLog.push({ from: 'bot', html: designReply(text) });
  designRender();
}
function designForm(ev) {
  ev.preventDefault();
  const i = ev.target.q, t = i.value.trim();
  if (t) designSend(t);
  i.value = '';
  return false;
}
function toggleDesign() {
  designOpen = !designOpen;
  if (designOpen && botOpen) toggleBot();
  document.getElementById('design-panel').classList.toggle('open', designOpen);
  if (designOpen) { designRender(); document.querySelector('#design-panel input').focus(); }
}

applyDesign();
applySession();
restoreNav();
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (document.getElementById('confirm-overlay').classList.contains('open')) closeConfirm(false);
  else if (botOpen) toggleBot();
  else if (designOpen) toggleDesign();
});
render();
</script>
</body>
